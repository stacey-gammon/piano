<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Practice App</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar for controls */
        .sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar-toggle {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
        }

        .sidebar h3 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: 0.8;
        }

        .control-group input,
        .control-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        .control-group input[type="range"] {
            padding: 0;
        }

        .track-control-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .track-control-item h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            margin: 5px;
            width: calc(50% - 10px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-play {
            background: linear-gradient(45deg, #00b894, #00a085);
        }

        .btn-rewind {
            background: linear-gradient(45deg, #feca57, #ff9ff3);
        }

        .btn-ff {
            background: linear-gradient(45deg, #48dbf8, #0abde3);
        }

        /* Main content area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            min-width: 0;
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .karaoke-display {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 10px;
            min-height: 0;
            overflow-y: auto;
        }

        .track-row {
            margin-bottom: 10px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 4px solid;
            transition: all 0.3s ease;
        }

        .track-row.active {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .track-row.track-1 { border-left-color: #19e70a; }
        .track-row.track-2 { border-left-color: #ea1dce; }
        .track-row.track-3 { border-left-color: #45b7d1; }
        .track-row.track-4 { border-left-color: #f39c12; }
        .track-row.track-chords { border-left-color: #ffd700; }

        .track-header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: start;
            gap: 12px;
            margin-bottom: 6px;
        }

        .track-name {
            font-size: 18px;
            font-weight: bold;
            min-width: 72px;
            padding-top: 8px;
        }

        .track-degrees {
            flex: 1;
            min-width: 0;
        }

        .track-strip {
            display: flex;
            align-items: stretch;
            gap: 8px;
            min-width: 0;
            overflow-x: auto;
            padding: 2px 0 8px;
            scrollbar-width: thin;
        }

        .track-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            min-width: 64px;
            padding: 8px 10px 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
            flex: 0 0 auto;
            border: none;
            color: white;
            font: inherit;
        }

        .track-cell:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .track-cell-note {
            font-size: 26px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            line-height: 1;
        }

        .track-cell-lyric {
            min-height: 20px;
            font-size: 15px;
            text-align: center;
            white-space: nowrap;
            color: rgba(255, 255, 255, 0.92);
        }

        .track-cell.prev {
            opacity: 0.4;
        }

        .track-cell.current {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .track-cell.current .track-cell-note {
            font-size: 32px;
        }

        .track-cell.next {
            opacity: 0.6;
        }

        .track-lyrics {
            margin-left: 84px;
            font-size: 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.65);
        }

        .key {
            cursor: pointer;
            border: 2px solid #222;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-weight: bold;
            transition: all 0.1s ease;
            user-select: none;
            position: relative;
        }

        .white-key {
            background: linear-gradient(to bottom, #fff, #f0f0f0);
            color: #333;
            width: 50px;
            height: 160px;
            margin: 0 1px;
            border-radius: 0 0 8px 8px;
        }

        .black-key {
            background: linear-gradient(to bottom, #333, #111);
            color: white;
            width: 30px;
            height: 100px;
            position: absolute;
            z-index: 2;
            border-radius: 0 0 6px 6px;
        }

        .key:active, .key.active {
            transform: scale(0.95);
        }

        .white-key:active, .white-key.active {
            background: linear-gradient(to bottom, #e0e0e0, #d0d0d0);
        }

        .black-key:active, .black-key.active {
            background: linear-gradient(to bottom, #222, #000);
        }

        .piano {
            display: flex;
            justify-content: flex-start;
            position: relative;
            height: 180px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 10px;
            margin-top: 20px;
            overflow-x: auto;
        }

        .key-in-scale {
            /* degree number badge is sufficient signal — no extra outline */
        }

        .key-track-1 {
            box-shadow: 0 0 15px #19e70a;
            border-color: #19e70a !important;
        }

        .key-track-2 {
            box-shadow: 0 0 15px #ea1dce;
            border-color: #ea1dce !important;
        }

        .key-track-3 {
            box-shadow: 0 0 15px #45b7d1;
            border-color: #45b7d1 !important;
        }

        .key-track-4 {
            box-shadow: 0 0 15px #f39c12;
            border-color: #f39c12 !important;
        }

        .degree-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #ffd700;
            color: #333;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }

        .step-counter {
            text-align: center;
            font-size: 14px;
            opacity: 0.7;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                height: 100vh;
                z-index: 999;
            }

            .main-content {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <h3>Controls</h3>
            
            <div class="control-group">
                <label>Song</label>
                <select id="songSelect" onchange="loadSong()"></select>
            </div>

            <div class="control-group">
                <label>Key</label>
                <select id="keySelect">
                    <option value="">Select key...</option>
                </select>
            </div>

            <div class="control-group">
                <label>Show</label>
                <select id="displayModeSelect">
                    <option value="degrees">Degrees</option>
                    <option value="notes">Notes</option>
                </select>
            </div>

            <div class="control-group">
                <label>Tempo (BPM)</label>
                <input type="number" id="tempo" value="120" min="60" max="200" onchange="updateTempo()">
            </div>

            <div class="control-group">
                <label>Loop Line</label>
                <select id="loopLineSelect">
                    <option value="">Off</option>
                </select>
            </div>

            <div class="control-group">
                <button class="btn btn-play" onclick="togglePlayback()" style="width: 100%; font-size: 16px; padding: 14px;">▶️ Play</button>
                <button class="btn btn-rewind" onclick="rewindToBeginning()">⏪⏪</button>
                <button class="btn btn-rewind" onclick="rewind()">⏪</button>
                <button class="btn btn-ff" onclick="fastForward()">⏩</button>
            </div>

            <div class="control-group">
                <button class="btn" id="playHoldToggleBtn" onclick="togglePlayHold()" style="background: rgba(255,255,255,0.15); width: 100%; font-size: 13px;">
                    🔔 Play &amp; Hold
                </button>
            </div>

            <div id="trackControls">
                <!-- Track controls will be added here -->
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>🎹 Piano Practice</h1>
                <div class="step-counter" id="step-counter">Step: 0</div>
            </div>

            <div class="karaoke-display" id="karaokeDisplay">
                <!-- Track rows will be added here -->
            </div>

            <div class="piano" id="piano">
                <!-- Piano keys will be generated here -->
            </div>
        </div>
    </div>

    <script src="songManager.js"></script>
    <script src="audioPlayer.js"></script>
    <script src="musicTheory.js"></script>
    <script>
        // Audio context and notes
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Recording variables
        let isRecording = false;
        let currentNotes = [];
        let recordingStartTime = 0;
        let tempo = 120;
        let defaultOctave = 4;
        let eighthNoteLength = (60 / tempo / 2) * 1000; // 1/8 note in ms
        let currentSong = null;
        let tracks = { "1": { volume: 5 } }; // Default track
        let songKey = "Unknown";

        // Song bank is now declared in songManager.js

        // Playback variables
        let isPlaying = false;
        let playbackInterval = null;
        let currentStep = 1;
        let wasPlaying = false; // Track if we were playing before

        // Play and hold variables
        let isPlayHolding = false;

        // Muted tracks
        const mutedTracks = {};
        let playHoldInterval = null;

        // Solo note state (clicking a degree in a track plays only that track's note)
        let soloPlayingTrack = null;
        let soloPlayingStep = null;
        let soloOscillators = [];
        let pendingLoopLineValue = '';
        let displayMode = 'degrees';
        let audioUnlockAttempted = false;

        async function unlockAudioContext() {
            if (!audioContext) return false;

            try {
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                // iOS Safari can still require an actual graph start/stop after resume.
                const buffer = audioContext.createBuffer(1, 1, 22050);
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.start(0);
                source.stop(0);
                audioUnlockAttempted = true;
                return true;
            } catch (error) {
                console.warn('Audio unlock failed:', error);
                return false;
            }
        }

        function registerAudioUnlockHandlers() {
            const unlockOnce = async () => {
                if (audioUnlockAttempted && audioContext.state === 'running') return;
                await unlockAudioContext();
            };

            ['touchstart', 'touchend', 'pointerdown', 'click'].forEach(eventName => {
                document.addEventListener(eventName, unlockOnce, { passive: true });
            });
        }

        function stopSoloNote() {
            soloOscillators.forEach(osc => { try { osc.stop(); } catch(e) {} });
            soloOscillators = [];
            soloPlayingTrack = null;
            soloPlayingStep = null;
            updateTrackDisplays();
        }

        async function playTrackNoteToggle(trackId, step) {
            await unlockAudioContext();
            // Toggle off if same note clicked again
            if (soloPlayingTrack === trackId && soloPlayingStep === step) {
                stopSoloNote();
                return;
            }
            stopSoloNote();

            const note = currentNotes.find(n => n.track === trackId && Math.abs(parseFloat(n.step) - parseFloat(step)) < 0.001);
            if (!note) return;

            soloPlayingTrack = trackId;
            soloPlayingStep = step;

            const isChordTrack = trackId.toLowerCase() === 'chords';
            if (note.chord || isChordTrack) {
                const chord = note.chord || note.degree;
                let chordNotes = [];
                if (/\d+/.test(chord)) {
                    chordNotes = getChordNotes(songKey, parseInt(chord));
                } else {
                    chordNotes = chordDefinitions[chord] || [];
                }
                const octave = tracks[trackId]?.default_octave || defaultOctave;
                chordNotes.forEach(cn => playSoloNote(cn + octave, trackId));
            } else if (note.degree) {
                const actualNote = mapUnparsedDegreeToNote(note.degree, songKey, trackId);
                if (actualNote) playSoloNote(actualNote, trackId);
            }
            updateTrackDisplays();
        }

        function playSoloNote(note, trackId) {
            const freq = noteFreqs[note];
            if (!freq) return;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.setValueAtTime(freq, audioContext.currentTime);
            osc.type = 'triangle';
            const vol = ((tracks[trackId]?.volume ?? 5) / 5) * 0.3 * perceivedLoudnessScale(freq);
            gain.gain.setValueAtTime(0, audioContext.currentTime);
            gain.gain.linearRampToValueAtTime(vol, audioContext.currentTime + 0.01);
            osc.start(audioContext.currentTime);
            soloOscillators.push(osc);
        }

        function toggleMute(trackId) {
            mutedTracks[trackId] = !mutedTracks[trackId];
            const btn = document.getElementById(`mute-btn-${trackId}`);
            const row = document.getElementById(`track-row-${trackId}`);
            if (mutedTracks[trackId]) {
                if (btn) { btn.textContent = '🔇'; btn.style.opacity = '0.5'; }
                if (row) row.style.opacity = '0.4';
            } else {
                if (btn) { btn.textContent = '🔊'; btn.style.opacity = '1'; }
                if (row) row.style.opacity = '1';
            }
        }

        // Sidebar toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        function getTrackDisplayLines(trackNotes) {
            const playableNotes = trackNotes.filter(note => note.degree || note.chord || note.note);
            if (!playableNotes.length) return [];

            const lines = [];
            let currentLine = [];
            const hasExplicitLineMarkers = playableNotes.some(note =>
                note.start_of_line || note.startOfLine || note.new_line || note.newLine
            );
            const fallbackLineMaxNotes = 12;

            playableNotes.forEach((note, index) => {
                const previousNote = playableNotes[index - 1];
                const previousEnd = previousNote
                    ? (parseFloat(previousNote.step) || 1) + (parseFloat(previousNote.duration) || 1) + (parseFloat(previousNote.pause) || 0) - 1
                    : null;
                const noteStart = parseFloat(note.step) || 1;
                const startsExplicitLine = index > 0 && (
                    note.start_of_line || note.startOfLine || note.new_line || note.newLine
                );
                const hasLargeGap = !hasExplicitLineMarkers && previousEnd !== null && (noteStart - previousEnd) > 2;
                const lineIsFull = !hasExplicitLineMarkers && currentLine.length >= fallbackLineMaxNotes;

                if ((startsExplicitLine || hasLargeGap || lineIsFull) && currentLine.length) {
                    lines.push(currentLine);
                    currentLine = [];
                }

                currentLine.push(note);
            });

            if (currentLine.length) {
                lines.push(currentLine);
            }

            return lines;
        }

        function getTrackNotesForDisplay(trackId) {
            return currentNotes
                .filter(n => n.track === trackId)
                .sort((a, b) => (parseFloat(a.step) || 0) - (parseFloat(b.step) || 0));
        }

        function getLoopReferenceTrackId() {
            const trackIds = Object.keys(tracks).sort();
            const lyricalTrackId = trackIds.find(trackId => {
                const trackNotes = getTrackNotesForDisplay(trackId);
                return trackNotes.some(note => (note.lyrics || '').trim()) && trackId.toLowerCase() !== 'chords';
            });
            return lyricalTrackId || trackIds.find(trackId => trackId.toLowerCase() !== 'chords') || trackIds[0] || null;
        }

        function getLoopLines() {
            const trackId = getLoopReferenceTrackId();
            if (!trackId) return [];
            const trackNotes = getTrackNotesForDisplay(trackId);
            return getTrackDisplayLines(trackNotes)
                .map((notes, index) => ({ index: index + 1, notes }))
                .filter(line => line.notes.length > 0);
        }

        function getNaturalMaxStep() {
            if (!currentNotes.length) return 1;
            return Math.max(...currentNotes.map(n => (parseFloat(n.step) || 1) + (parseFloat(n.duration) || n.stretch || 1) - 1)) + 1;
        }

        function getSelectedLoopLine() {
            const select = document.getElementById('loopLineSelect');
            if (!select || !select.value) return null;
            return parseInt(select.value, 10) || null;
        }

        function getLoopBounds() {
            const naturalMaxStep = getNaturalMaxStep();
            const selectedLine = getSelectedLoopLine();
            const loopLines = getLoopLines();

            if (!selectedLine) {
                return { start: 1, end: naturalMaxStep };
            }

            const line = loopLines.find(entry => entry.index === selectedLine);
            if (!line || !line.notes.length) {
                return { start: 1, end: naturalMaxStep };
            }

            const firstNote = line.notes[0];
            const lastNote = line.notes[line.notes.length - 1];
            const start = parseFloat(firstNote.step) || 1;
            const end = (parseFloat(lastNote.step) || start) + (parseFloat(lastNote.duration) || 1) + (parseFloat(lastNote.pause) || 0);
            return { start, end };
        }

        function getSelectedDisplayMode() {
            const select = document.getElementById('displayModeSelect');
            return select?.value || displayMode || 'degrees';
        }

        function formatDisplayText(note, trackId) {
            if (!note || (!note.degree && !note.chord && !note.note)) return null;

            const currentDisplayMode = getSelectedDisplayMode();

            if (note.degree) {
                if (currentDisplayMode === 'notes') {
                    const actualNote = mapUnparsedDegreeToNote(note.degree, songKey, trackId);
                    if (actualNote) {
                        return actualNote.replace(/\d+$/, '');
                    }
                }
                return note.degree.toString().replace(/\[.*?\]/g, '');
            }

            if (note.chord) {
                return /^\d+$/.test(note.chord)
                    ? (convertChordDegreeToName ? convertChordDegreeToName(note.chord, songKey) : note.chord)
                    : note.chord;
            }

            if (note.note) {
                return currentDisplayMode === 'notes'
                    ? note.note.replace(/\d+$/, '')
                    : note.note;
            }

            return null;
        }

        function refreshLoopLineOptions() {
            const select = document.getElementById('loopLineSelect');
            if (!select) return;

            const desiredValue = pendingLoopLineValue || select.value;
            const loopLines = getLoopLines();
            select.innerHTML = '<option value="">Off</option>';

            loopLines.forEach(line => {
                const option = document.createElement('option');
                option.value = String(line.index);
                const firstLyric = line.notes.find(note => (note.lyrics || '').trim())?.lyrics?.trim() || '';
                option.textContent = firstLyric ? `Line ${line.index}: ${firstLyric}` : `Line ${line.index}`;
                select.appendChild(option);
            });

            if (desiredValue && Array.from(select.options).some(option => option.value === desiredValue)) {
                select.value = desiredValue;
            } else {
                select.value = '';
            }

            pendingLoopLineValue = '';
        }

        function findReferenceNoteIndex(trackNotes) {
            for (let i = 0; i < trackNotes.length; i++) {
                const note = trackNotes[i];
                const noteStart = parseFloat(note.step) || 1;
                const noteDuration = parseFloat(note.duration) || 1;
                const notePause = parseFloat(note.pause) || 0;
                const noteEnd = noteStart + noteDuration - 1;
                const pauseStart = noteEnd + 1;
                const pauseEnd = pauseStart + notePause - 1;

                if (currentStep >= noteStart && currentStep <= noteEnd) {
                    return i;
                }

                if (currentStep >= pauseStart && currentStep <= pauseEnd) {
                    return i;
                }

                if (currentStep < noteStart) {
                    return i;
                }
            }

            return trackNotes.length - 1;
        }

        // Update karaoke display
        function updateKaraokeDisplay() {
            const karaokeDisplay = document.getElementById('karaokeDisplay');
            karaokeDisplay.innerHTML = '';
            
            if (!currentNotes || currentNotes.length === 0) {
                karaokeDisplay.innerHTML = '<div style="text-align: center; opacity: 0.5;">No song loaded</div>';
                return;
            }

            const trackIds = Object.keys(tracks).sort();
            
            trackIds.forEach((trackId, index) => {
                const trackNumber = index + 1;
                const trackRow = document.createElement('div');
                const trackClass = trackId === 'chords' ? 'chords' : trackNumber;
                trackRow.className = `track-row track-${trackClass}`;
                trackRow.id = `track-row-${trackId}`;
                
                const trackHeader = document.createElement('div');
                trackHeader.className = 'track-header';
                
                const trackName = document.createElement('div');
                trackName.className = 'track-name';
                trackName.textContent = trackId.charAt(0).toUpperCase() + trackId.slice(1);
                trackHeader.appendChild(trackName);

                const muteBtn = document.createElement('button');
                muteBtn.id = `mute-btn-${trackId}`;
                muteBtn.textContent = '🔊';
                muteBtn.title = 'Mute/unmute';
                muteBtn.style.cssText = 'background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; margin-left: 8px;';
                muteBtn.onclick = () => toggleMute(trackId);

                const trackDegrees = document.createElement('div');
                trackDegrees.className = 'track-degrees';

        // Update individual track displays (replaces updateTrackDegreesDisplay)
        function updateTrackDisplays() {
            if (!currentNotes || currentNotes.length === 0) return;
            
            Object.keys(tracks).forEach(trackId => {
                const trackNotes = currentNotes.filter(n => n.track === trackId).sort((a, b) => (a.step || 0) - (b.step || 0));
                
                if (trackNotes.length === 0) return;
                
                // Find current note
                let currentNote = null;
                let referenceNoteIndex = -1;
                
                for (let i = 0; i < trackNotes.length; i++) {
                    const note = trackNotes[i];
                    const noteStart = parseFloat(note.step) || 1;
                    const noteDuration = parseFloat(note.duration) || 1;
                    const notePause = parseFloat(note.pause) || 0;
                    const noteEnd = noteStart + noteDuration - 1;
                    const pauseStart = noteEnd + 1;
                    const pauseEnd = pauseStart + notePause - 1;
                    
                    if (currentStep >= noteStart && currentStep <= noteEnd) {
                        currentNote = note;
                        referenceNoteIndex = i;
                        break;
                    } else if (currentStep >= pauseStart && currentStep <= pauseEnd) {
                        referenceNoteIndex = i;
                        break;
                    } else if (currentStep < noteStart) {
                        referenceNoteIndex = i;
                        break;
                    }
                }
                
                if (referenceNoteIndex === -1) {
                    referenceNoteIndex = trackNotes.length - 1;
                }
                
                // Get previous and next notes
                const previousNotes = [];
                const nextNotes = [];
                
                for (let i = referenceNoteIndex - 1; i >= 0 && previousNotes.length < 2; i--) {
                    previousNotes.unshift(trackNotes[i]);
                }
                
                for (let i = referenceNoteIndex + 1; i < trackNotes.length && nextNotes.length < 2; i++) {
                    nextNotes.push(trackNotes[i]);
                }
                
                // Format note for display — returns { text, duration }
                function formatNote(note) {
                    const text = formatDisplayText(note, trackId);
                    if (!text) return null;
                    const duration = parseFloat(note.duration) || 1;
                    return { text, duration };
                }
                
                // Update degrees display
                const degreesElement = document.getElementById(`track-degrees-${trackId}`);
                if (degreesElement) {
                    const displayLines = getTrackDisplayLines(trackNotes);
                    const referenceIndex = findReferenceNoteIndex(trackNotes);
                    const referenceNote = trackNotes[referenceIndex] || currentNote || trackNotes[0];
                    let activeLineIndex = displayLines.findIndex(line => line.some(note => note.step === referenceNote?.step));
                    if (activeLineIndex < 0) activeLineIndex = 0;
                    const activeLine = displayLines[activeLineIndex] || [];

                    function degreeChip(note, cls) {
                        const fmt = formatNote(note);
                        if (!fmt) return '';
                        const { text, duration } = fmt;
                        const isSolo = soloPlayingTrack === trackId && soloPlayingStep === note.step;
                        const minW = Math.max(64, duration * 44);
                        const soloOutline = isSolo ? 'outline: 2px solid #ffd700;' : '';
                        const lyric = (note.lyrics || '').trim() || '&nbsp;';
                        return `<button class="track-cell ${cls}" onclick="playTrackNoteToggle('${trackId}', ${note.step})" title="Play/stop this note" style="min-width:${minW}px; ${soloOutline}">
                            <span class="track-cell-note">${text}</span>
                            <span class="track-cell-lyric">${lyric}</span>
                        </button>`;
                    }

                    let degreesHtml = '';
                    if (activeLine.length) {
                        activeLine.forEach(note => {
                            let cls = 'next';
                            if (currentNote && note.step === currentNote.step) {
                                cls = 'current';
                            } else if (referenceNote && (parseFloat(note.step) || 0) <= (parseFloat(referenceNote.step) || 0)) {
                                cls = 'prev';
                            }
                            degreesHtml += degreeChip(note, cls);
                        });
                    } else {
                        previousNotes.forEach(note => { degreesHtml += degreeChip(note, 'prev'); });
                        if (currentNote) degreesHtml += degreeChip(currentNote, 'current');
                        nextNotes.forEach(note => { degreesHtml += degreeChip(note, 'next'); });
                    }

                    degreesElement.innerHTML = degreesHtml
                        ? `<div class="track-strip">${degreesHtml}</div>`
                        : '<span style="opacity: 0.3;">—</span>';
                }
                
                // Update line label
                const lyricsElement = document.getElementById(`track-lyrics-${trackId}`);
                if (lyricsElement) {
                    const displayLines = getTrackDisplayLines(trackNotes).filter(line =>
                        line.some(note => (note.lyrics || '').trim())
                    );
                    if (!displayLines.length) {
                        lyricsElement.innerHTML = '';
                    } else {
                        const referenceIndex = findReferenceNoteIndex(trackNotes);
                        const referenceNote = trackNotes[referenceIndex] || currentNote || trackNotes[0];
                        let activeLineIndex = displayLines.findIndex(line => line.some(note => note.step === referenceNote?.step));
                        if (activeLineIndex < 0) activeLineIndex = 0;
                        lyricsElement.textContent = `Line ${activeLineIndex + 1} of ${displayLines.length}`;
                    }
                }
                
                // Update active state
                const trackRow = document.getElementById(`track-row-${trackId}`);
                if (trackRow) {
                    if (currentNote && (currentNote.degree || currentNote.chord || currentNote.note)) {
                        trackRow.classList.add('active');
                    } else {
                        trackRow.classList.remove('active');
                    }
                }
            });
        }

        // Generate piano keys
        function createPiano() {
            const piano = document.getElementById('piano');
            piano.innerHTML = '';
            const whiteKeys = ['B2', 'C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'B3', 'C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5', 'D5'];
            const blackKeyWidth = 30;

            function attachKeyHandlers(key, note) {
                const startNote = async (event) => {
                    event.preventDefault();
                    await unlockAudioContext();
                    playNote(note);
                };

                const endNote = () => stopNote();

                key.addEventListener('mousedown', startNote);
                key.addEventListener('mouseup', endNote);
                key.addEventListener('mouseleave', endNote);
                key.addEventListener('touchstart', startNote, { passive: false });
                key.addEventListener('touchend', endNote);
                key.addEventListener('touchcancel', endNote);
                key.addEventListener('pointerdown', startNote);
                key.addEventListener('pointerup', endNote);
                key.addEventListener('pointercancel', endNote);
            }
            
            // Create white keys
            whiteKeys.forEach((note, index) => {
                const key = document.createElement('div');
                key.className = 'key white-key';
                key.textContent = note;
                key.dataset.note = note;
                attachKeyHandlers(key, note);
                piano.appendChild(key);
            });

            // Create black keys with relative positioning
            const blackKeyPositions = [
                { note: 'C#3', relativeTo: 'C3', offset: 0.75 },
                { note: 'D#3', relativeTo: 'D3', offset: 0.75 },
                { note: 'F#3', relativeTo: 'F3', offset: 0.75 },
                { note: 'G#3', relativeTo: 'G3', offset: 0.75 },
                { note: 'A#3', relativeTo: 'A3', offset: 0.75 },
                { note: 'C#4', relativeTo: 'C4', offset: 0.75 },
                { note: 'D#4', relativeTo: 'D4', offset: 0.75 },
                { note: 'F#4', relativeTo: 'F4', offset: 0.75 },
                { note: 'G#4', relativeTo: 'G4', offset: 0.75 },
                { note: 'A#4', relativeTo: 'A4', offset: 0.75 },
                { note: 'C#5', relativeTo: 'C5', offset: 0.75 },
                { note: 'D#5', relativeTo: 'D5', offset: 0.75 }
            ];
            
            // Position black keys after white keys are laid out
            requestAnimationFrame(() => {
                blackKeyPositions.forEach(({ note, relativeTo }) => {
                    const key = document.createElement('div');
                    key.className = 'key black-key';
                    key.textContent = note;
                    key.dataset.note = note;

                    const whiteKeyElement = piano.querySelector(`[data-note="${relativeTo}"]`);
                    if (whiteKeyElement) {
                        const relativeLeft = whiteKeyElement.offsetLeft + whiteKeyElement.offsetWidth - (blackKeyWidth / 2);
                        key.style.left = `${relativeLeft}px`;
                    }

                    attachKeyHandlers(key, note);
                    piano.appendChild(key);
                });
            });
        }

        // Function to get all lyrics with their step numbers
        function getAllLyricsWithSteps() {
            const lyricsMap = new Map();
            currentNotes.forEach(note => {
                if (note.lyrics && note.lyrics.trim()) {
                    const step = note.step;
                    if (!lyricsMap.has(step)) {
                        lyricsMap.set(step, []);
                    }
                    lyricsMap.get(step).push(note.lyrics.trim());
                }
            });
            return lyricsMap;
        }

        // Function to display lyrics with context (previous 4, current, next 4)
        function displayLyricsWithContext(currentStep, currentLyrics) {
            // If it's step 1 or 0, show the next lyrics, otherwise leave the previous lyric
            // display the same. 
            if (!currentLyrics && currentStep > 1) {
                return;
            }
            const lyricsMap = getAllLyricsWithSteps();
            const allSteps = Array.from(lyricsMap.keys()).sort((a, b) => a - b);
            const currentStepIndex = allSteps.indexOf(currentStep);
            
            let displayText = '';
            
            // Add previous 4 lyrics
            for (let i = Math.max(0, currentStepIndex - 4); i < currentStepIndex; i++) {
                const step = allSteps[i];
                const lyrics = lyricsMap.get(step).filter((lyric, index, arr) => arr.indexOf(lyric) === index).join(' ');
                if (lyrics) {
                    displayText += `<span style="color: #aaa; font-size: 18px;">${lyrics}</span> `;
                }
            }
            
            // Add current lyrics (highlighted)
            if (currentLyrics) {
                displayText += `<span style="color: #fff; font-size: 24px; font-weight: bold; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px;">${currentLyrics}</span> `;
            }
            
            // Add next 4 lyrics
            for (let i = currentStepIndex + 1; i <= Math.min(allSteps.length - 1, currentStepIndex + 4); i++) {
                const step = allSteps[i];
                const lyrics = lyricsMap.get(step).filter((lyric, index, arr) => arr.indexOf(lyric) === index).join(' ');
                if (lyrics) {
                    displayText += `<span style="color: #aaa; font-size: 18px;">${lyrics}</span> `;
                }
            }
            
            const lyricsDisplay = document.getElementById('lyrics-display');
            lyricsDisplay.innerHTML = displayText;
        }

        async function startPlayback() {
            await unlockAudioContext();

            // Stop play-and-hold if it's running
            if (isPlayHolding) {
                stopPlayHold();
            }
            
            const playButton = document.querySelector('.btn-play');
            if (playButton) playButton.textContent = '⏸️ Pause';
            isPlaying = true;
            const { start: loopStart, end: loopEnd } = getLoopBounds();

            // Only reset currentStep if we weren't playing before or if we're at the end
            if (!wasPlaying || currentStep >= loopEnd || currentStep < loopStart) {
                currentStep = loopStart;
            }

            
            playbackInterval = setInterval(() => {
                // Play notes that start at current step (support fractional steps)
                const notesToPlay = currentNotes.filter(n => {
                    const noteStep = parseFloat(n.step) || 1;
                    // Allow small floating point tolerance for step matching
                    return Math.abs(noteStep - currentStep) < 0.001;
                });
                
                // Update display for current step
                updateDisplayAtCurrentStep();
                
                // Play each note or chord with appropriate volume
                const currentTime = audioContext.currentTime;
                notesToPlay.forEach(n => {
                    if (mutedTracks[n.track]) return;
                    const trackVolume = tracks[n.track] ? tracks[n.track].volume : 5;
                    playNoteOrChord(n, trackVolume, songKey, currentTime);
                });
                
                currentStep++;
                if (currentStep >= loopEnd) {
                    currentStep = loopStart; // Loop back to defined start
                }
            }, eighthNoteLength);
        }

        function pausePlayback() {
            wasPlaying = true; // Mark that we were playing
            isPlaying = false;
            stopAllOscillators();
            if (playbackInterval) {
                clearInterval(playbackInterval);
                playbackInterval = null;
            }
            
            // Update button text
            const playButton = document.querySelector('.btn-play');
            if (playButton) playButton.textContent = '▶️ Play';
        }
        
        // Play and hold functions
        function togglePlayHold() {
            if (isPlayHolding) {
                stopPlayHold();
            } else {
                startPlayHold();
            }
        }
        
        async function startPlayHold() {
            if (isPlayHolding) return;
            await unlockAudioContext();
            
            // Stop regular playback if it's running
            if (isPlaying) {
                pausePlayback();
            }
            
            isPlayHolding = true;
            const toggleBtn = document.getElementById('playHoldToggleBtn');
            toggleBtn.textContent = '⏹️ Stop';
            toggleBtn.style.background = 'linear-gradient(45deg, #e17055, #d63031)';
            
            // Play current step notes once — oscillators run indefinitely until stopPlayHold()
            playCurrentStepNotes();
        }
        
        function stopPlayHold() {
            if (!isPlayHolding) return;
            
            isPlayHolding = false;
            const toggleBtn = document.getElementById('playHoldToggleBtn');
            toggleBtn.textContent = '▶️ Play & Hold';
            toggleBtn.style.background = 'linear-gradient(45deg, #00b894, #00a085)';
            
            // Stop the interval
            if (playHoldInterval) {
                clearInterval(playHoldInterval);
                playHoldInterval = null;
            }
            
            // Stop all active oscillators
            stopAllOscillators();
        }
        
        function playCurrentStepNotes() {
            // Get notes that should be playing at current step (including notes from previous steps that are still within their duration)
            const notesAtStep = currentNotes.filter(n => {
                const noteStart = n.step || 1;
                const noteDuration = parseFloat(n.duration) || 1;
                const notePause = parseFloat(n.pause) || 0;
                const noteEnd = noteStart + noteDuration + notePause - 1;
                
                // Include notes that are currently playing (not in pause)
                return currentStep >= noteStart && currentStep < noteStart + noteDuration;
            });

            // Stop any existing oscillators from previous play-hold cycles
            stopAllOscillators();
            
            // Play each note (volume is handled naturally in playContinuousNote)
            notesAtStep.forEach(note => {
                if (mutedTracks[note.track]) return;
                is_chord_track = note.track == "chords";
                if (note.chord || is_chord_track) {
                    // Handle chord notes
                    playChordNote(note);
                } else if (note.degree) {
                    // Handle degree-based notes
                    playDegreeNote(note);
                }
            });
        }
        
        function playChordNote(note) {
            chord = note.chord || note.degree;
            
            // Get chord notes based on the chord definition
            let chordNotes = [];
            if (/\d+/.test(chord)) {
                // Numeric chord (scale degree)
                const degree = parseInt(chord);
                chordNotes = getChordNotes(songKey, degree);
            } else {
                // Named chord
                chordNotes = chordDefinitions[chord] || [];
            }
            
            // Play each note in the chord
            chordNotes.forEach(chordNote => {
                const octave = tracks[note.track]?.default_octave || defaultOctave;
                const noteWithOctave = chordNote + octave;
                playContinuousNote(noteWithOctave, note.track);
            });
            
            // Visual feedback for chord (highlight multiple keys)
            chordNotes.forEach(chordNote => {
                const octave = tracks[note.track]?.default_octave || defaultOctave;
                const noteWithOctave = chordNote + octave;
                const keyElement = document.querySelector(`[data-note="${noteWithOctave}"]`);
                if (keyElement) {
                    keyElement.classList.add('active');
                    // Remove active class after a short duration for visual feedback
                    setTimeout(() => keyElement.classList.remove('active'), 100);
                }
            });
        }
        
        function playDegreeNote(note) {
            if (!note.degree) return;
            
            // Map degree to actual note
            const actualNote = mapUnparsedDegreeToNote(note.degree, songKey, note.track);
            if (actualNote) {
                playContinuousNote(actualNote, note.track);
                
                // Visual feedback for single note
                const keyElement = document.querySelector(`[data-note="${actualNote}"]`);
                if (keyElement) {
                    keyElement.classList.add('active');
                    // Remove active class after a short duration for visual feedback
                    setTimeout(() => keyElement.classList.remove('active'), 100);
                }
            }
        }
        
        function playContinuousNote(note, trackId) {
            const freq = noteFreqs[note];
            if (!freq) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);
            oscillator.type = 'triangle';
            
            // Set volume based on track volume
            const trackVolume = tracks[trackId]?.volume ?? 5;
            let volume = 0.3;
            if (trackVolume !== null) {
                if (trackVolume === 0) return;
                volume = (trackVolume / 5) * 0.3;
                // Apply frequency scaling so low notes aren't overpowering
                volume *= perceivedLoudnessScale(freq);
            }
            
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(volume, audioContext.currentTime + 0.01);
            
            oscillator.start(audioContext.currentTime);
            
            // Store oscillator for later stopping (compatible with audioPlayer.js)
            activeOscillators.push(oscillator);
        }
        
        
        // Navigation functions
        function rewind() {
            if (!currentNotes.length) return;
            const { start: loopStart } = getLoopBounds();
            
            // Move back by 8 steps (or to loop start if we'd go past it)
            currentStep = Math.max(loopStart, currentStep - 1);
            
            // Update display without starting playback
            updateDisplayAtCurrentStep();
        }
        
        function fastForward() {
            if (!currentNotes.length) return;
            const { end: loopEnd } = getLoopBounds();
            
            // Move forward by 8 steps (or to loop end if we'd go past it)
            currentStep = Math.min(loopEnd - 1, currentStep + 1);
            
            // Update display without starting playback
            updateDisplayAtCurrentStep();
        }
        
        function updateDisplayAtCurrentStep() {
            // Update step counter
            const stepCounter = document.getElementById('step-counter');
            if (stepCounter && currentNotes.length > 0) {
                const naturalMaxStep = Math.max(...currentNotes.map(n => parseFloat(n.step) + (parseFloat(n.duration) || 1) - 1)) + 1;
                stepCounter.textContent = `Step: ${currentStep} / ${naturalMaxStep}`;
            }
            
            // Highlight keys based on which track is playing them
            highlightKeysByTrack();
            
            // Update karaoke display (replaces old track degrees display)
            if (document.getElementById('karaokeDisplay')) {
                updateTrackDisplays();
            } else {
                // Fallback to old display if karaoke display doesn't exist yet
                updateTrackDegreesDisplay();
            }
        }

        // Function to highlight keys in the current song's key
        function highlightKeysInKey() {
            
            if (!songKey || songKey === "Unknown") {
                console.log('No valid songKey, clearing highlights');
                // Clear all highlights if no key
                clearKeyHighlights();
                return;
            }
            
            // Get notes in the current key
            const keyNotes = getNotesInKey(songKey);
            
            // Clear previous highlights
            clearKeyHighlights();
            
            // Highlight keys and add degree indicators
            keyNotes.forEach(({ note, degree }) => {
                const keyElement = document.querySelector(`[data-note="${note}"]`);
                if (keyElement) {
                    // Add highlight class
                    keyElement.classList.add('key-in-scale');
                    
                    // Add degree indicator
                    const degreeIndicator = document.createElement('div');
                    degreeIndicator.className = 'degree-indicator';
                    degreeIndicator.textContent = degree;
                    keyElement.appendChild(degreeIndicator);
                    
                }
            });
            
        }
        
        // Function to clear key highlights
        function clearKeyHighlights() {
            const allKeys = document.querySelectorAll('.key');
            allKeys.forEach(key => {
                key.classList.remove('key-in-scale');
                // Remove all track highlighting classes (1-4)
                for (let i = 1; i <= 4; i++) {
                    key.classList.remove(`key-track-${i}`);
                }
                const existingIndicator = key.querySelector('.degree-indicator');
                if (existingIndicator) {
                    existingIndicator.remove();
                }
            });
        }

        // Function to highlight keys based on which track is playing them
        function highlightKeysByTrack() {
            if (!currentNotes || !currentNotes.length) return;
            
            // Clear previous track highlights
            const allKeys = document.querySelectorAll('.key');
            allKeys.forEach(key => {
                for (let i = 1; i <= 4; i++) {
                    key.classList.remove(`key-track-${i}`);
                }
            });
            
            // Get current step and find notes being played
            const notesAtCurrentStep = currentNotes.filter(n => n.step === currentStep);
            
            // Create a map of track IDs to track numbers (1-4)
            const trackIdToNumber = {};
            const trackIds = Object.keys(tracks).sort();
            trackIds.forEach((trackId, index) => {
                if (index < 4) { // Support up to 4 tracks
                    trackIdToNumber[trackId] = index + 1;
                }
            });
            
            highlightKeysInKey();
            // Highlight keys for each track
            notesAtCurrentStep.forEach(note => {
                if (note.chord) {
                    return;
                }
                const trackNumber = trackIdToNumber[note.track];
                if (trackNumber) {
                    let noteToHighlight = null;
                    
                    if (note.degree) {
                        // Map scale degree to actual note
                        noteToHighlight = mapUnparsedDegreeToNote(note.degree, songKey, note.track);
                    } else if (note.note) {
                        noteToHighlight = note.note;
                    } else if (note.chord) {
                        // For chords, we'll highlight the root note
                        if (/\d+/.test(note.chord)) {
                            const degree = parseInt(note.chord);
                            noteToHighlight = mapUnparsedDegreeToNote(degree, songKey, note.track);
                        } else {
                            // For named chords, use the first note
                            const chordNotes = chordDefinitions[note.chord];
                            if (chordNotes && chordNotes.length > 0) {
                                noteToHighlight = chordNotes[0];
                            }
                        }
                    }
                    
                    if (noteToHighlight) {
                        const keyElement = document.querySelector(`[data-note="${noteToHighlight}"]`);
                        if (keyElement) {
                            keyElement.classList.add(`key-track-${trackNumber}`);
                        }
                    }
                }
            });
        }


        // Helper function to convert chord degree to actual chord name
        function convertChordDegreeToName(degree, songKey) {
            if (!songKey || songKey === "Unknown") {
                return degree.toString(); // fallback to degree number
            }
            
            // Determine if it's major or minor key
            const isMinorKey = songKey.toLowerCase().includes('m');
            const scale = isMinorKey ? getMinorScale(songKey) : getMajorScale(songKey);
            
            const chordPatterns = {
                1: [0, 2, 4],
                2: [1, 3, 5], 
                3: [2, 4, 6],
                4: [3, 5, 0],
                5: [4, 6, 1],
                6: [5, 0, 2],
                7: [6, 1, 3]
            };

            const indices = chordPatterns[degree];
            if (!indices) {
                return degree.toString(); // fallback for invalid degrees
            }
            
            const notes = indices.map(i => scale[i]);
            const root = notes[0];

            // Calculate intervals to determine chord quality
            const intervals = [
                (12 + (noteToSemitone(notes[1]) - noteToSemitone(root))) % 12,
                (12 + (noteToSemitone(notes[2]) - noteToSemitone(root))) % 12
            ];

            let quality = "";
            if (intervals[0] === 3 && intervals[1] === 7) quality = "m";      // minor triad
            else if (intervals[0] === 4 && intervals[1] === 7) quality = "";  // major triad
            else if (intervals[0] === 3 && intervals[1] === 6) quality = "dim"; // diminished
    
            return root + quality;
        }

        // Function to update track degrees display
        function updateTrackDegreesDisplay() {
            if (!currentNotes || !currentNotes.length) return;
            
            // Update each track's display
            Object.keys(tracks).forEach(trackId => {
                const displayElement = document.getElementById(`track-note-degrees-display-${trackId}`);
                if (displayElement) {
                    // Get all notes for this track, sorted by step
                    const trackNotes = currentNotes.filter(n => n.track === trackId).sort((a, b) => (a.step || 0) - (b.step || 0));
                    
                    if (trackNotes.length === 0) {
                        displayElement.innerHTML = '';
                        return;
                    }
                    
                    // Find the current note (the one that should be playing at currentStep)
                    let currentNote = null;
                    let currentNoteIndex = -1;
                    let referenceNoteIndex = -1; // This will be used for finding prev/next notes
                    
                    for (let i = 0; i < trackNotes.length; i++) {
                        const note = trackNotes[i];
                        const noteStart = parseFloat(note.step) || 1;
                        const noteDuration = parseFloat(note.duration) || 1;
                        const notePause = parseFloat(note.pause) || 0;
                        const noteEnd = noteStart + noteDuration - 1; // Don't include pause in active note range
                        const pauseStart = noteEnd + 1;
                        const pauseEnd = pauseStart + notePause - 1;
                        
                        // Check if we're in the note playing range (not pause)
                        if (currentStep >= noteStart && currentStep <= noteEnd) {
                            currentNote = note;
                            currentNoteIndex = i;
                            referenceNoteIndex = i;
                            break;
                        }
                        // If we're in a pause, find the note that just finished
                        else if (currentStep >= pauseStart && currentStep <= pauseEnd) {
                            // We're in a pause, so the reference note is the one that just finished
                            referenceNoteIndex = i;
                            break;
                        }
                        // If we're before any note, use the first note as reference
                        else if (currentStep < noteStart) {
                            referenceNoteIndex = i;
                            break;
                        }
                    }
                    
                    // If we haven't found a reference note, use the last note
                    if (referenceNoteIndex === -1) {
                        referenceNoteIndex = trackNotes.length - 1;
                    }
                    
                    // Get previous and next notes
                    const PREVIOUS_NOTES_LIMIT = 2;
                    const NEXT_NOTES_LIMIT = 2;
                    
                    let previousNotes = [];
                    let nextNotes = [];
                    
                    // Get previous notes
                    // If we're in a pause, include the note that just finished as a previous note
                    let startIndex = referenceNoteIndex;
                    if (currentNote === null && referenceNoteIndex >= 0) {
                        // We're in a pause, so include the note that just finished
                        previousNotes.unshift(trackNotes[referenceNoteIndex]);
                        startIndex = referenceNoteIndex - 1;
                    } else {
                        // We're playing a note, so start from the note before it
                        startIndex = referenceNoteIndex - 1;
                    }
                    
                    for (let i = startIndex; i >= 0 && previousNotes.length < PREVIOUS_NOTES_LIMIT; i--) {
                        previousNotes.unshift(trackNotes[i]);
                    }
                    
                    // Get next notes
                    for (let i = referenceNoteIndex + 1; i < trackNotes.length && nextNotes.length < NEXT_NOTES_LIMIT; i++) {
                        nextNotes.push(trackNotes[i]);
                    }
                    
                    let displayText = '';
                    
                    // Helper function to format a note with duration (no pause display)
                    function formatNote(note) {
                        if (!note) return '';
                        
                        let text = '';
                        if (note.degree) {
                            text = note.degree.toString();
                        } else if (note.chord) {
                            // If it's a numeric chord degree, convert to actual chord name
                            if (/^\d+$/.test(note.chord)) {
                                text = convertChordDegreeToName(note.chord, songKey);
                            } else {
                                text = note.chord;
                            }
                        } else if (note.note) {
                            text = note.note;
                        } else {
                            return '';
                        }
                        
                        // Add duration in parentheses if not default (1)
                        const duration = parseFloat(note.duration) || 1;
                        if (Math.abs(duration - 1) > 0.001) {
                            text += `(${duration})`;
                        }
                        
                        // Don't display pause information
                        
                        return text;
                    }
                    
                    // Previous notes (dimmed)
                    if (previousNotes.length > 0) {
                        const prevTexts = previousNotes.map(formatNote).filter(text => text);
                        if (prevTexts.length > 0) {
                            displayText += `<span style="color: #666; font-size: 12px;">${prevTexts.join(' ')}</span> `;
                        }
                    }
                    
                    // Current note (highlighted)
                    if (currentNote) {
                        // Skip notes without degrees, chords, or note values (silent notes)
                        if (currentNote.degree || currentNote.chord || currentNote.note) {
                            const currentText = formatNote(currentNote);
                            if (currentText) {
                                displayText += `<span style="color: #fff; font-size: 14px; font-weight: bold; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 3px;">${currentText}</span> `;
                            }
                        } else if (nextNotes.length > 0 && nextNotes[0]) {
                            // If current note is silent, show the next note as "upcoming"
                            const nextText = formatNote(nextNotes[0]);
                            if (nextText) {
                                displayText += `<span style="color: #aaa; font-size: 12px;">→ ${nextText}</span> `;
                            }
                        }
                    }
                    
                    // Next notes (dimmed)
                    if (nextNotes.length > 0) {
                        const nextTexts = nextNotes.map(formatNote).filter(text => text);
                        if (nextTexts.length > 0) {
                            displayText += `<span style="color: #666; font-size: 12px;">${nextTexts.join(' ')}</span>`;
                        }
                    }
                    
                    displayElement.innerHTML = displayText;
                    displayElement.style.minHeight = '20px';
                    displayElement.style.textAlign = 'center';
                }
            });
        }

        // Initialize key selector with all available keys
        function initializeKeySelector() {
            const keySelect = document.getElementById('keySelect');
            if (!keySelect) {
                console.log('Key selector element not found during initialization');
                return;
            }
            
            const keys = [
                'C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B',
                'Cm', 'C#m', 'Dm', 'D#m', 'Em', 'Fm', 'F#m', 'Gm', 'G#m', 'Am', 'A#m', 'Bm'
            ];
            
            keySelect.innerHTML = '<option value="">Select key...</option>';
            keys.forEach(key => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = key;
                keySelect.appendChild(option);
            });
            
            console.log(`Initialized key selector with ${keys.length} keys`);

        }

        // Query param persistence
        function saveUrlParams() {
            const params = new URLSearchParams();
            const songSelect = document.getElementById('songSelect');
            if (songSelect && songSelect.value !== '') params.set('song', songSelect.value);
            const tempoEl = document.getElementById('tempo');
            if (tempoEl) params.set('tempo', tempoEl.value);
            const displayModeSelect = document.getElementById('displayModeSelect');
            if (displayModeSelect && displayModeSelect.value && displayModeSelect.value !== 'degrees') {
                params.set('displayMode', displayModeSelect.value);
            }
            const loopLineSelect = document.getElementById('loopLineSelect');
            if (loopLineSelect && loopLineSelect.value) params.set('loopLine', loopLineSelect.value);
            if (songKey && songKey !== 'Unknown') params.set('key', songKey);
            history.replaceState(null, '', '?' + params.toString());
        }

        function applyUrlParams() {
            const params = new URLSearchParams(location.search);
            if (params.has('tempo')) {
                const t = parseInt(params.get('tempo'));
                document.getElementById('tempo').value = t;
                tempo = t;
                eighthNoteLength = (60 / tempo / 2) * 1000;
            }
            displayMode = params.get('displayMode') || 'degrees';
            const displayModeSelect = document.getElementById('displayModeSelect');
            if (displayModeSelect) {
                displayModeSelect.value = displayMode;
            }
            pendingLoopLineValue = params.get('loopLine') || '';
            return params.get('song'); // returns saved song index or null
        }

        // Initialize
        async function initializeApp() {
            registerAudioUnlockHandlers();
            createPiano();

            // Load songs first, then populate the dropdown
            await loadSongs();

            initializeKeySelector();

            // Add event listener to song select dropdown
            const songSelect = document.getElementById('songSelect');
            if (songSelect) {
                songSelect.addEventListener('change', function() {
                    if (this.value !== '') {
                        loadSong();
                        saveUrlParams();
                    }
                });
                // Apply saved params and pick song
                const savedSong = applyUrlParams();
                const params = new URLSearchParams(location.search);
                if (savedSong !== null && songBank[parseInt(savedSong)]) {
                    songSelect.value = savedSong;
                } else {
                    songSelect.value = "0";
                }
                loadSong();
                // Restore key override after song load (song load sets key from file)
                if (params.has('key')) {
                    setTimeout(() => {
                        songKey = params.get('key');
                        updateKeySelector(songKey);
                        highlightKeysInKey();
                    }, 150);
                }
            }

            // Add event listener to key select dropdown
            const keySelect = document.getElementById('keySelect');
            if (keySelect) {
                keySelect.addEventListener('change', function() {
                    if (this.value !== '') {
                        songKey = this.value;
                        if (typeof highlightKeysInKey === 'function') highlightKeysInKey();
                        saveUrlParams();
                    }
                });
            }

            const displayModeSelect = document.getElementById('displayModeSelect');
            if (displayModeSelect) {
                displayModeSelect.value = displayMode;
                displayModeSelect.addEventListener('change', function() {
                    displayMode = this.value || 'degrees';
                    updateDisplayAtCurrentStep();
                    saveUrlParams();
                });
            }

            const loopLineSelect = document.getElementById('loopLineSelect');
            if (loopLineSelect) {
                loopLineSelect.addEventListener('change', () => {
                    const { start } = getLoopBounds();
                    currentStep = start;
                    updateDisplayAtCurrentStep();
                    saveUrlParams();
                });
            }

            // Initialize karaoke display
            refreshLoopLineOptions();
            updateKaraokeDisplay();
        }

        // Initialize
        initializeApp().catch(error => {
            console.error('Failed to initialize app:', error);
        });

        // Note: songData textarea removed from new UI - editing happens in song files directly
        
        // Add keyboard shortcuts for navigation
        document.addEventListener('keydown', function(event) {
            // Only handle shortcuts if not typing in an input field
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
                return;
            }
            
            switch(event.key) {
                case 'ArrowLeft':
                    event.preventDefault();
                    rewind();
                    break;
                case 'ArrowRight':
                    event.preventDefault();
                    fastForward();
                    break;
                case ' ':
                    event.preventDefault();
                    togglePlayback();
                    break;
            }
        });
    </script>
